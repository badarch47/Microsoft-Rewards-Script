name: Daily Microsoft Rewards

on:
    # GitHub cron uses UTC. 01:00 UTC is 09:00 in China (UTC+8).
    schedule:
        - cron: '0 1 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: daily-microsoft-rewards
    cancel-in-progress: false

env:
    TZ: Asia/Shanghai
    # Keep browsers in a stable cacheable directory instead of node_modules,
    # so `npm ci` never wipes them and actions/cache can reuse them.
    PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/patchright
    NODE_OPTIONS: --disable-warning=ExperimentalWarning

jobs:
    collect-daily-points:
        name: Collect daily Microsoft Rewards points
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            ACCOUNT_1_EMAIL: ${{ secrets.ACCOUNT_1_EMAIL }}
            ACCOUNT_1_PASSWORD: ${{ secrets.ACCOUNT_1_PASSWORD }}
            ACCOUNT_1_TOTP_SECRET: ${{ secrets.ACCOUNT_1_TOTP_SECRET }}
            ACCOUNT_1_RECOVERY_EMAIL: ${{ secrets.ACCOUNT_1_RECOVERY_EMAIL }}
            ACCOUNT_1_GEO_LOCALE: ${{ vars.ACCOUNT_1_GEO_LOCALE }}
            ACCOUNT_1_LANG_CODE: ${{ vars.ACCOUNT_1_LANG_CODE }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Validate account configuration
              shell: bash
              run: |
                  if [[ -z "${ACCOUNT_1_EMAIL:-}" ]]; then
                    echo "::error::Set the ACCOUNT_1_EMAIL repository secret before running this workflow."
                    exit 1
                  fi

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build script
              run: npm run build

            - name: Restore headless Chromium cache
              id: chromium-cache
              uses: actions/cache@v4
              with:
                  path: /home/runner/.cache/patchright
                  key: ${{ runner.os }}-patchright-${{ hashFiles('package-lock.json') }}

            # The ubuntu runner image already ships the shared libraries Chromium needs,
            # so `--with-deps` (a large apt install on every run) is unnecessary here.
            # The command stays idempotent: it exits immediately when the cache already has the browser.
            - name: Install headless Chromium
              timeout-minutes: 8
              run: npx patchright install --only-shell chromium

            - name: Verify headless Chromium
              timeout-minutes: 3
              run: |
                  node --input-type=module -e "
                    import { chromium } from 'patchright';
                    const browser = await chromium.launch({ headless: true });
                    console.log('Chromium launch OK:', browser.version());
                    await browser.close();
                  "

            - name: Prepare headless configuration
              shell: bash
              run: |
                  cp config.example.json config.json
                  node dist/util/ConfigEnvOverrides.js apply --config config.json

            - name: Run daily Microsoft Rewards tasks
              id: rewards
              env:
                  REWARDS_LOG_FILE: rewards-run.log
              run: node scripts/github/run-with-logging.js

            - name: Send Enterprise WeChat notification
              if: always()
              env:
                  WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
                  REWARDS_OUTCOME: ${{ steps.rewards.outcome || 'failure' }}
                  REWARDS_LOG_FILE: rewards-run.log
              run: node scripts/github/notify-wecom.js
